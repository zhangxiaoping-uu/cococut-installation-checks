name: Verify public Windows installer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 80
    env:
      HF_HUB_OFFLINE: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - name: Validate acceptance tool imports
        run: node --input-type=module -e "await import('./scripts/delivery/windows-branding.mjs'); console.log('acceptance dependencies ready')"
      - name: Download and authenticate immutable candidate
        run: node run.mjs --download-only
      - name: Fresh install, overwrite and local processing
        run: node run.mjs --verify-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-244-verification
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .local/rebuild/windows-96/*.json
            .local/rebuild/windows-96/*.png
